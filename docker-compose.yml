services:

  mongodb:
    image: mongo:7
    container_name: blue-green-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: registration-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/blue-green-db
    depends_on:
      mongodb:
        condition: service_healthy

  frontend-blue:
    build: ./frontend-blue
    container_name: frontend-blue
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      PORT: 3100
    depends_on:
      - backend

  frontend-green:
    build: ./frontend-green
    container_name: frontend-green
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      PORT: 3200
    depends_on:
      - backend

volumes:
  mongo-data: